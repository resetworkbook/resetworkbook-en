<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you — RESET Workbook</title>

<style>
:root{
  --cream:#F5F0E8;
  --brown:#684D3D;
  --dark:#28231F;
  --line:#D8CBBF;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--cream);
  color:var(--dark);
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.box{
  max-width:650px;
  background:#FFFDF9;
  border:1px solid var(--line);
  padding:70px 45px;
}

.logo{
  font-family:Georgia,'Times New Roman',serif;
  font-size:32px;
  letter-spacing:.18em;
  margin-bottom:35px;
}

h1{
  font-family:Georgia,'Times New Roman',serif;
  font-weight:400;
  font-size:42px;
  margin:0 0 20px;
}

p{
  color:#5D544D;
  font-size:17px;
  line-height:1.6;
  margin:0 auto 30px;
}

.btn{
  display:inline-block;
  background:var(--brown);
  color:white;
  padding:14px 26px;
  border-radius:999px;
  font-size:12px;
  letter-spacing:.12em;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">RESET</div>

  <h1>Thank you!</h1>

  <p>
    You have successfully joined the RESET subscriber list.
    You will receive news and updates about RESET directly by email.
  </p>

  <a class="btn" href="https://resetworkbook.github.io/resetworkbook-en/">
    BACK TO LANDING →
  </a>

</div>

</body>
</html>
