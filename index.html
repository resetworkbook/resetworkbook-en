let lang=localStorage.getItem('reset-lang')||'EN';
let emailVal='',consent=false,success=false,error='';

function getNested(o,path){return path.split('.').reduce((a,c)=>a&&a[c],o)}

function render(){
  const d=DATA[lang];
  document.documentElement.lang=lang.toLowerCase();
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=getNested(d,el.getAttribute('data-i18n'));
    if(typeof v==='string') el.textContent=v;
  });
  document.getElementById('navBuy').textContent=d.nav.buyNow;
  document.getElementById('secureStrong').textContent=lang==='IT'?'Disponibile ora':'Available now';
  document.getElementById('coverCopy').innerHTML=d.hero.coverCopy.join('<br>');
  // strip
  document.getElementById('strip').innerHTML=d.strip.map(x=>`<div><strong>${x.b}</strong><br>${x.s}</div>`).join('');
  // chapters
  document.getElementById('chapters').innerHTML=d.journey.chapters.map(c=>`<div class="chapter"><div class="num">${c.n}</div><div><h3>${c.t}</h3><p>${c.d}</p></div></div>`).join('');
  // method
  document.getElementById('methodGrid').innerHTML=d.method.items.map(m=>`<article><b>${m.k}</b><p>${m.v}</p></article>`).join('');
  document.getElementById('lastK').textContent=d.method.lastK;
  document.getElementById('lastV').textContent=d.method.lastV;
  document.getElementById('daysGrid').innerHTML=d.challenge.days.map(x=>`<span>${x}</span>`).join('');
  document.getElementById('foryouList').innerHTML=d.foryou.list.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('faqGrid').innerHTML=`<div>${d.faq.items.slice(0,2).map(f=>`<div style="margin-bottom:32px"><h3 style="font-size:20px;margin-bottom:8px">${f.q}</h3><p style="color:#655b53;font-size:15px;line-height:1.6">${f.a}</p></div>`).join('')}</div><div>${d.faq.items.slice(2).map(f=>`<div style="margin-bottom:32px"><h3 style="font-size:20px;margin-bottom:8px">${f.q}</h3><p style="color:#655b53;font-size:15px;line-height:1.6">${f.a}</p></div>`).join('')}</div>`;
  document.getElementById('emailPara').innerHTML=`${lang==='IT'?'Iscriviti e ricevi in regalo la':'Subscribe and receive the'} <strong>${d.email.paraBold}</strong>: ${lang==='IT'?'un breve esercizio pratico per fare spazio nella mente.':'a short, practical exercise to make space in your mind.'}`;
  document.getElementById('btnIT').className=lang==='IT'?'active':''; document.getElementById('btnEN').className=lang==='EN'?'active':'';
  renderForm();
}

function renderForm(){
  const d=DATA[lang].email;
  const wrap=document.getElementById('formWrap');
  if(success){
    wrap.innerHTML=`<div class="reset-success"><h4>${d.successTitle}</h4><p>${d.successText}</p><button class="btn" style="margin-top:16px" onclick="resetSuccess()">${lang==='IT'?'Invia un\'altra':'Send another'}</button></div>`;
    return;
  }
  wrap.innerHTML=`<form onsubmit="handleSubmit(event)" novalidate><label class="reset-label" for="emailInput">${d.label}</label><input id="emailInput" class="reset-input" type="email" placeholder="${d.placeholder}" value="${emailVal}" oninput="updateEmail(this.value)"><div class="reset-consent-row"><button type="button" class="reset-checkbox ${consent?'checked':''}" onclick="toggleConsent()">${consent?'✓':''}</button><span class="reset-consent-text">${d.consent}</span></div>${error?`<div class="reset-error">${error}</div>`:''}<button type="submit" class="btn reset-submit-btn">${d.button}</button><p class="reset-note">${d.note}</p></form>`;
  const inp=document.getElementById('emailInput'); if(inp){inp.value=emailVal; inp.focus(); const len=emailVal.length; try{inp.setSelectionRange(len,len)}catch(e){}}
}
function updateEmail(v){emailVal=v;}
function toggleConsent(){consent=!consent; renderForm();}
function resetSuccess(){success=false; emailVal=''; consent=false; error=''; renderForm();}
function handleSubmit(e){
  e.preventDefault();
  const d=DATA[lang];
  if(!emailVal.includes('@')||!emailVal.includes('.')){error=lang==='IT'?"Inserisci un'email valida":"Please enter a valid email"; renderForm(); return;}
  if(!consent){error=lang==='IT'?"Acconsenti per continuare":"Consent required"; renderForm(); return;}
  error=''; success=true; renderForm();
  // Qui puoi collegare MailerLite / Brevo / Formspree
  console.log('Subscribe', emailVal);
}
document.getElementById('btnIT').onclick=()=>{lang='IT'; localStorage.setItem('reset-lang','IT'); render();};
document.getElementById('btnEN').onclick=()=>{lang='EN'; localStorage.setItem('reset-lang','EN'); render();};
render();
</script>
