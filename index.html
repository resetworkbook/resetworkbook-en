nt}}var Pr=yf,f=ws,K=ws;var Rf={EN:{nav:{journey:"The Journey",method:"The Method",days:"30 Days",faq:"FAQ",subscribe:"Subscribe",buyNow:"BUY NOW →"},hero:{eyebrow:"Available now · Digital and print versions",title:"RESET Workbook",subtitle:"Make space. Regain clarity. Start again.",lead:"A practical journey of reflection, observation, and concrete exercises to create mental space and learn to manage what takes up your time, energy, and attention.",promo:"AVAILABLE NOW",price:"From $9.90",priceOld:"$12.90",cta:"CHOOSE YOUR VERSION →",secure:"Available now · digital PDF and print version",coverCopy:["Make space.","Regain clarity.","Start again."]},strip:[{b:"10 chapters",s:"of guided work"},{b:"Exercises",s:"and workbook pages"},{b:"Home Reset",s:"and digital space"},{b:"30 Days",s:"of RESET"}],journey:{eyebrow:"What you will find in RESET",h2:"A journey to make space, one step at a time.",p:"RESET does not promise a perfect life or an unrealistic routine. It starts with observation and moves through small, concrete, sustainable changes.",chapters:[{n:"01",t:"Pause to Start Again",d:"Observe your everyday life and what takes up your time, energy, and mental space."},{n:"02",t:"Make Space Before You Organize",d:"Reduce, eliminate, delegate, and create margin before adding new systems."},{n:"03",t:"Brain Reset",d:"A Brain Dump to get out of your head everything you are trying to keep in mind."},{n:"04",t:"Home Reset",d:"Lighten a micro-zone using KEEP, MOVE, LET GO, and DECIDE LATER."},{n:"05",t:"Digital Reset",d:"Reclaim your attention and reduce notifications and automatic distractions."},{n:"06",t:"Time Reset",d:"Create more margin and build a more sustainable approach to time."},{n:"07",t:"Life Reset",d:"Choose what to keep and what you no longer want to carry forward out of habit."},{n:"08",t:"Weekly Reset",d:"Return to center when your week starts to fill up."},{n:"09",t:"30-Day Reset Challenge",d:"Thirty days of small, concrete actions to experience what it means to make more space."},{n:"10",t:"Your Personal System",d:"Choose the practices you want to keep and know where to start again when you need to."}]},method:{eyebrow:"The RESET Method",h2:"Before you organize, make space.",p:"The method follows five steps: recognize what takes up space, eliminate what no longer serves you, simplify, create balance, and transform what remains.",items:[{k:"R — RECOGNIZE",v:"Look at what is taking up space without trying to solve it immediately."},{k:"E — ELIMINATE",v:"Remove what you no longer need, even if you have learned to live with it."},{k:"S — SIMPLIFY",v:"Reduce steps, decisions, and complexity wherever possible."},{k:"E — EASE",v:"Leave margin between what you have to do and how you want to live."}],lastK:"T — TRANSFORM",lastV:"Build a more sustainable way of managing what remains."},challenge:{eyebrow:"At the End of the Journey",h2:"30-Day Reset Challenge",p:"Thirty days are not about becoming a new person. They are about experiencing what happens when, for one month, you choose to make a little more space.",strong:"If you miss a day, do not start over: keep going.",cardEyebrow:"One Day at a Time",cardTitle:"Small actions. More space.",days:["SNAPSHOT","BRAIN DUMP","ELIMINATE","MICRO-ZONE","NOTIFICATIONS","ONE DECISION","WEEKLY RESET","PAUSE","DELEGATE","PROTECT"]},foryou:{eyebrow:"This workbook is for you if...",list:["you feel like you have too many things to do;","you often feel weighed down by everyday commitments;","you struggle to know where to start;","you feel the need to create some order;","you want to give yourself space to pause and reflect;","you prefer a practical journey built around exercises and activities."],notRight:"Maybe it is not the right time if...",notRightP1:"You are looking for an instant solution that does everything for you.",notRightP2:"RESET requires your participation: part of the value of the journey comes from the time you choose to dedicate to the activities and reflections."},formats:{eyeb           cursor:pointer;
          font-family:Arial,Helvetica,sans-serif;
          color:var(--brown);
          font-size:12px;
          line-height:1;
          padding:0;
        }
        .reset-checkbox.checked{
          background:var(--brown);
          border-color:var(--brown);
          color:white;
        }
        .reset-consent-text{
          font-family:Arial,Helvetica,sans-serif;
          font-size:13px;
          line-height:1.5;
          color:#7a6b60;
        }
        .reset-submit-btn{
          margin-top:26px;
          align-self:flex-start;
          padding:17px 32px;
          font-size:13px;
          letter-spacing:.14em;
        }
        .reset-note{
          font-family:Arial,Helvetica,sans-serif;
          font-size:12px;
          line-height:1.55;
          color:#8a7b70;
          margin:20px 0 0;
          text-align:left;
        }
        .reset-error{
          font-family:Arial,Helvetica,sans-serif;
          font-size:12px;
          color:#a65a44;
          margin-top:10px;
        }
        .reset-success{
          font-family:Arial,Helvetica,sans-serif;
          background:#f5f0e8;
          border:1px solid #d8cbbf;
          padding:22px;
          text-align:left;
        }
        .reset-success h4{
          font-family:Georgia,'Times New Roman',serif;
          font-weight:400;
          font-size:22px;
          margin:0 0 8px;
        }
        .reset-success p{
          font-size:14px;
          color:#6a5e55;
          margin:0;
          line-height:1.5;
        }

        /* FINAL */
        .final{
          background:var(--brown);
          color:white;
          text-align:center;
          padding:90px 8vw;
        }
        .final h2{
          font-size:52px;
          color:white;
          font-family:Georgia,'Times New Roman',serif;
          font-weight:400;
        }
        .final p{
          max-width:650px;
          margin:20px auto 30px;
          color:#eee6de;
          font-family:Arial,Helvetica,sans-serif;
          font-size:16px;
          line-height:1.6;
        }
        .final .btn{
          background:white;
          color:var(--brown);
        }
        .final .btn:hover{background:#f5f0e8}
        footer{
          padding:28px 8vw;
          background:#453328;
          color:#eee;
          font-size:12px;
          display:flex;
          justify-content:space-between;
          font-family:Arial,Helvetica,sans-serif;
        }
        .muted{color:#766a61;font-family:Arial,Helvetica,sans-serif}

        @media(max-width:900px){
          .navlinks{display:none}
          .hero,.challenge,.twocol{grid-template-columns:1fr}
          .hero{padding:55px 6vw;gap:40px}
          .strip{grid-template-columns:1fr 1fr}
          .method{grid-template-columns:1fr 1fr}
          .chapters{grid-template-columns:1fr}
          .section{padding:65px 6vw}
          .final h2{font-size:40px}
          .days{grid-template-columns:repeat(2,1fr)}
          footer{flex-direction:column;gap:8px}
          .device-wrap{order:-1}
          .email-card{padding:28px 22px}
          #lista-email h2{font-size:38px}
        }
        @media(max-width:520px){
          .nav{padding:12px 5vw}
          .lang-toggle{padding:5px 10px}
          .btn{padding:12px 18px;font-size:11px}
          .hero h1{font-size:40px}
          .subtitle{font-size:22px}
          .strip div{padding:20px 10px;font-size:12px}
          .method{grid-template-columns:1fr}
          .method article{border-right:0;border-bottom:1px solid var(--line)}
          .method article:last-child{border-bottom:0}
        }
